<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-label="Animated system information panel">
    <style>
        <![CDATA[
            .blink { animation: blink 1s steps(1, end) infinite; }
            .panel-glow { animation: pulse 3.5s ease-in-out infinite; }
            .typebar { animation: sweep 5.5s linear infinite; }
            @keyframes blink {
                0%, 49% { opacity: 1; }
                50%, 100% { opacity: 0; }
            }
            @keyframes pulse {
                0%, 100% { opacity: 0.28; }
                50% { opacity: 0.58; }
            }
            @keyframes sweep {
                0% { transform: translateX(-18px); }
                100% { transform: translateX(950px); }
            }
        ]]>
    </style>
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#050816" />
            <stop offset="100%" stop-color="#0b1220" />
        </linearGradient>
        <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#132033" />
            <stop offset="100%" stop-color="#0a111c" />
        </linearGradient>
        <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2ee59d" />
            <stop offset="100%" stop-color="#7dd3fc" />
        </linearGradient>
        <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
            <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#17263a" stroke-width="1" opacity="0.7" />
        </pattern>
        <clipPath id="line-0"><rect x="0" y="118" width="0" height="34"><animate attributeName="width" from="0" to="680" dur="1.05s" begin="0.45s" fill="freeze" /></rect></clipPath><clipPath id="line-1"><rect x="0" y="174" width="0" height="34"><animate attributeName="width" from="0" to="680" dur="1.05s" begin="1.07s" fill="freeze" /></rect></clipPath><clipPath id="line-2"><rect x="0" y="230" width="0" height="34"><animate attributeName="width" from="0" to="680" dur="1.05s" begin="1.69s" fill="freeze" /></rect></clipPath><clipPath id="line-3"><rect x="0" y="286" width="0" height="34"><animate attributeName="width" from="0" to="680" dur="1.05s" begin="2.31s" fill="freeze" /></rect></clipPath>
    </defs>

    <rect width="980" height="400" rx="24" fill="url(#bg)" />
    <rect width="980" height="400" rx="24" fill="url(#grid)" opacity="0.25" />
    <circle cx="842" cy="60" r="156" fill="#14b8a6" opacity="0.08" />
    <circle cx="120" cy="336" r="176" fill="#7c3aed" opacity="0.07" />

    <rect x="24" y="24" width="932" height="352" rx="22" fill="url(#frame)" stroke="#22314f" stroke-width="1.2" />
    <rect x="24" y="24" width="932" height="72" rx="22" fill="#0d1324" />
    <rect x="24" y="66" width="932" height="30" fill="#0d1324" />

    <circle cx="58" cy="62" r="8" fill="#ef4444" />
    <circle cx="86" cy="62" r="8" fill="#f59e0b" />
    <circle cx="114" cy="62" r="8" fill="#22c55e" />

    <text x="160" y="66" font-family="monospace" font-size="28" font-weight="700" fill="#2ee59d">$ system.info</text>
    <text x="160" y="86" font-family="monospace" font-size="14" fill="#94a3b8">typewriter-driven snapshot of the local engineering stack</text>
    <text x="818" y="66" font-family="monospace" font-size="10" fill="#5f7f6e">live.panel</text>

    <rect x="64" y="118" width="680" height="1" fill="url(#accent)" opacity="0.16" />
    <rect x="64" y="118" width="100" height="1" fill="#2ee59d" opacity="0.65" class="typebar" />

    <g clip-path="url(#line-0)"><text x="64" y="138" font-family="monospace" font-size="16" fill="#6ee7b7">experience:</text><text x="250" y="138" font-family="monospace" font-size="20" font-weight="700" fill="#f8fafc">Software Engineer @ Synapx</text><rect x="560" y="122" width="10" height="22" rx="2" fill="#2ee59d" opacity="0.95" /></g><g clip-path="url(#line-1)"><text x="64" y="194" font-family="monospace" font-size="16" fill="#6ee7b7">current focus:</text><text x="250" y="194" font-family="monospace" font-size="20" font-weight="700" fill="#f8fafc">Building AI-powered applications</text><rect x="632" y="178" width="10" height="22" rx="2" fill="#2ee59d" opacity="0.95" /></g><g clip-path="url(#line-2)"><text x="64" y="250" font-family="monospace" font-size="16" fill="#6ee7b7">learning:</text><text x="250" y="250" font-family="monospace" font-size="20" font-weight="700" fill="#f8fafc">AI Agents | RAG Systems | Cloud Architecture</text><rect x="776" y="234" width="10" height="22" rx="2" fill="#2ee59d" opacity="0.95" /></g><g clip-path="url(#line-3)"><text x="64" y="306" font-family="monospace" font-size="16" fill="#6ee7b7">tech focus:</text><text x="250" y="306" font-family="monospace" font-size="20" font-weight="700" fill="#f8fafc">Python | LLMs | Automation</text><rect x="560" y="290" width="10" height="22" rx="2" fill="#2ee59d" opacity="0.95" /></g>

    <rect x="64" y="328" width="804" height="1" fill="#1f3a2d" opacity="0.7" />
    <text x="64" y="352" font-family="monospace" font-size="12" fill="#8fffb7">$ echo "shipping AI systems with clarity, speed, and production discipline"</text>
    <rect x="876" y="342" width="10" height="16" rx="2" fill="#8fffb7" class="blink" />
    <rect x="64" y="382" width="804" height="2" fill="#2ee59d" opacity="0.45">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.2s" repeatCount="indefinite" />
    </rect>
    <rect x="42" y="42" width="896" height="316" rx="18" fill="#ffffff" opacity="0.02" class="panel-glow" />
</svg>
