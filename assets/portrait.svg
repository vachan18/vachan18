<svg xmlns="http://www.w3.org/2000/svg" width="384" height="646" viewBox="0 0 384 646" role="img" aria-label="Animated ASCII portrait">
  <defs>
    <linearGradient id="frame" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#14311f" />
      <stop offset="50%" stop-color="#0f1d16" />
      <stop offset="100%" stop-color="#081015" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2ee59d" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#2ee59d" stop-opacity="0" />
    </radialGradient>
    <clipPath id="reveal">
      <rect x="18" y="18" width="348" height="0">
        <animate attributeName="height" from="0" to="628" dur="2.6s" begin="0s" fill="freeze" />
      </rect>
    </clipPath>
    <pattern id="scanlines" width="100%" height="6" patternUnits="userSpaceOnUse">
      <rect width="100%" height="1" fill="#ffffff" opacity="0.05" />
    </pattern>
  </defs>

  <rect width="384" height="646" rx="18" fill="#03060a" />
  <rect x="7" y="7" width="370" height="632" rx="14" fill="url(#frame)" opacity="0.92" />
  <rect x="14" y="14" width="356" height="618" rx="10" fill="#0b1117" stroke="#1f3a2d" stroke-width="1.2" />
  <rect x="14" y="14" width="356" height="618" rx="10" fill="url(#glow)" opacity="0.8" />

  <circle cx="32" cy="28" r="5" fill="#ff5f57" />
  <circle cx="48" cy="28" r="5" fill="#febc2e" />
  <circle cx="64" cy="28" r="5" fill="#28c840" />

  <text x="88" y="33" font-family="monospace" font-size="14" fill="#8fffb7">$ whoami</text>
  <text x="258" y="33" font-family="monospace" font-size="10" fill="#5f7f6e">portrait.online</text>
