<svg xmlns="http://www.w3.org/2000/svg" width="384" height="652" viewBox="0 0 384 652" role="img" aria-label="Animated ASCII portrait">
  <style>
    <![CDATA[
      .frame-glow { animation: pulse 3.8s ease-in-out infinite; }
      .cursor { animation: blink 1s steps(1, end) infinite; }
      .scan { animation: drift 7s linear infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 0.22; }
        50% { opacity: 0.48; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes drift {
        from { transform: translateY(-8px); }
        to { transform: translateY(8px); }
      }
    ]]>
  </style>
  <defs>
    <linearGradient id="frame" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#14311f" />
      <stop offset="50%" stop-color="#0f1d16" />
      <stop offset="100%" stop-color="#081015" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2ee59d" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2ee59d" stop-opacity="0" />
    </radialGradient>
    <clipPath id="reveal">
      <rect x="18" y="18" width="348" height="0">
        <animate attributeName="height" from="0" to="634" dur="2.8s" begin="0s" fill="freeze" />
      </rect>
    </clipPath>
    <pattern id="scanlines" width="100%" height="8" patternUnits="userSpaceOnUse">
      <rect width="100%" height="1" fill="#ffffff" opacity="0.04" />
    </pattern>
  </defs>

  <rect width="384" height="652" rx="18" fill="#03060a" />
  <rect x="7" y="7" width="370" height="638" rx="14" fill="url(#frame)" opacity="0.92" />
  <rect x="14" y="14" width="356" height="624" rx="10" fill="#0b1117" stroke="#1f3a2d" stroke-width="1.2" />
  <rect x="14" y="14" width="356" height="624" rx="10" fill="url(#glow)" class="frame-glow" />

  <circle cx="32" cy="28" r="5" fill="#ff5f57" />
  <circle cx="48" cy="28" r="5" fill="#febc2e" />
  <circle cx="64" cy="28" r="5" fill="#28c840" />

  <text x="88" y="33" font-family="monospace" font-size="14" fill="#8fffb7">$ whoami</text>
  <text x="258" y="33" font-family="monospace" font-size="10" fill="#5f7f6e">portrait.local</text>

